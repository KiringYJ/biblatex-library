[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "biblio"
dynamic = ["version"]
description = "A configurable CLI engine for validating and maintaining BibLaTeX workspaces."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Yi-Jing Tseng" }]
keywords = ["biblatex", "bibliography", "metadata", "cli", "biber"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "bibtexparser>=2.0.0b8,<3.0.0", # v2 API
    "jsonschema>=4.22",
    "httpx>=0.27",
    "PyYAML>=6.0.1",
    "msgspec>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=4.1",
    "ruff>=0.5.0",
    "pip-tools>=7.5",
    "check-jsonschema>=0.33,<0.34",
    "pre-commit>=4.0.0",
    "ty",
]

[project.scripts]
biblio = "biblio.cli:main"

[project.urls]
Homepage = "https://github.com/KiringYJ/biblatex-library"
Repository = "https://github.com/KiringYJ/biblatex-library"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/biblio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/biblio"]

[tool.ruff]
line-length = 100
target-version = "py313"
respect-gitignore = true
extend-exclude = ["build", "dist", ".venv"]
src = ["src", "tests"]

[tool.ruff.lint]
# Start pragmatic: core errors + import sorting + safe upgrades + bugbears
select = ["E", "F", "I", "UP", "B"]
# Add ignores here as you go; keep empty initially
ignore = []
# Don't auto-fix "commented-out code" (if you enable ERA later)
unfixable = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["biblio"] # your package name under src/

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["typings"]

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.rules]
ambiguous-protocol-member = "error"
deprecated = "error"
division-by-zero = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "error"
useless-overload-body = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: marks tests as integration tests (require external dependencies like biber)",
]

[dependency-groups]
dev = [
    "check-jsonschema>=0.33.3",
    "pip-tools>=7.5.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.12",
    "ty",
]
