# Data hooks for biblio workspaces.
# Copy these into your .pre-commit-config.yaml (under the `repos:` key)
# after running `biblio init` to set up your workspace.
#
# These hooks normalize and validate your bibliography data on each commit.
# They require the biblio CLI and (optionally) biber to be installed.

  # Normalize and validate the coordinated three-artifact workspace.
  - repo: local
    hooks:
      - id: normalize-latex-accents
        name: Normalize LaTeX accents
        entry: uv
        args: ["run", "biblio", "normalize", "latex-accents"]
        language: system
        files: ^(bib/library\.bib|data/identifier_collection\.json|data/add_order\.json)$
        pass_filenames: false

      - id: normalize-dates
        name: Normalize dates (year -> date)
        entry: uv
        args: ["run", "biblio", "normalize", "year-to-date"]
        language: system
        files: ^(bib/library\.bib|data/identifier_collection\.json|data/add_order\.json)$
        pass_filenames: false

      - id: normalize-eprint
        name: Normalize eprint fields
        entry: uv
        args: ["run", "biblio", "normalize", "eprint-fields"]
        language: system
        files: ^(bib/library\.bib|data/identifier_collection\.json|data/add_order\.json)$
        pass_filenames: false

      - id: normalize-isbn
        name: Normalize ISBN (ISBN-10 -> ISBN-13)
        entry: uv
        args: ["run", "biblio", "normalize", "isbn"]
        language: system
        files: ^(bib/library\.bib|data/identifier_collection\.json|data/add_order\.json)$
        pass_filenames: false

      - id: validate-bibliography
        name: Validate coordinated bibliography workspace
        entry: uv
        args: ["run", "biblio", "validate"]
        language: system
        files: ^(bib/library\.bib|data/identifier_collection\.json|data/add_order\.json)$
        pass_filenames: false

      # Direct biber validation of .bib file integrity
      - id: biber-validate-bib
        name: Validate library.bib with biber --tool
        entry: biber
        args: ["--tool", "--validate-datamodel", "--output-directory", "bib/generated", "bib/library.bib"]
        language: system
        files: ^bib/library\.bib$
        pass_filenames: false
