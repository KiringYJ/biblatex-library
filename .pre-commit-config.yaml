# Run `pre-commit install` once, then hooks run on each commit.
# Update hook versions with: pre-commit autoupdate
#
# NOTE: Data hooks (normalize, validate, biber) are in pre-commit-data-hooks.yaml.
# Copy them to your workspace's .pre-commit-config.yaml after `biblio init`.
repos:
  # Ruff: lint + format (run linter first so fixes get reformatted)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
        args: [--fix]        # apply safe autofixes
      - id: ruff-format

  # Type checking with ty
  - repo: local
    hooks:
      - id: ty-check
        name: Run ty
        entry: uv
        args: ["run", "ty", "check", "."]
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|tests/.*\.py|pyproject\.toml)$

  # Tests
  - repo: local
    hooks:
      - id: pytest
        name: Run pytest
        entry: uv
        args: ["run", "python", "-m", "pytest", "tests/", "-v"]
        language: system
        pass_filenames: false
        files: ^(src/.*\.py|tests/.*\.py|pyproject\.toml)$

  # Small hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: |
          (?x)(
            ^\.vscode/settings\.json$|
            ^pyrightconfig\.json$
          )

# Skip local environments and build outputs.
exclude: |
  (?x)(
    ^\.venv/|
    ^build/|
    ^dist/
  )
